# Reference hyper-parameters for the Hebbian / CMA-ES trainer (scripts/hebbian/train.py).
# These mirror the train.py CLI defaults; documented here for reproducibility.
# Each parallel IsaacLab env evaluates one CMA-ES candidate, so set num_envs ~= popsize * n_repeats.

network:                    # single hidden layer (input -> latent -> output, no bias)
  latent_size: 4            # hidden units; genome = 4*(obs+act)*latent ~= 2.2k dims (upstream scale)
  hidden_activation: Tanh
  output_activation: Tanh
  hebbian_lr: 0.1           # online plastic weight update rate
  weight_init_scale: 0.01
  action_scale: 2.0         # maps Tanh output (+-1) to setpoint range (+-action_scale)
  obs_norm: zscore          # observation normalization: zscore (robust) | minmax ([-1,1]) | none
  shared_genome: true       # one plasticity rule shared by falcon1/2/3 (homogeneous drones)

cmaes:                      # matches thirdparty/hebbian_marl settings
  popsize: 30
  n_repeats: 3              # episodes per genome; fitness = mean episode return
  sigma: 0.3               # initial step size
  bound: 1.0               # ABCD coefficients in [-bound, bound]
  diagonal: false          # full aCMA-ES (as upstream); set true only for large genomes
  num_generations: 100

runtime:
  num_envs: 90             # ideally popsize * n_repeats
  seed: 42
