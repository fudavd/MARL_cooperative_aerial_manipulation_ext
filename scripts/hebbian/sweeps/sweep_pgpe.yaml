# W&B sweep: PGPE + ABC-only + evolved-init-weights, sweeping the EA hyperparameters.
# Init on the remote from /home/diggelen/AerialMan:
#   .venv/bin/wandb sweep --project hebbian-flycrane scripts/hebbian/sweeps/sweep_pgpe.yaml
# then run agents (each runs configs sequentially; ~4 fit on the 4090):
#   .venv/bin/wandb agent <ENTITY/PROJECT/SWEEP_ID>
program: scripts/hebbian/train.py
method: bayes                 # efficient for expensive runs (vs grid). use 'random' for uniform coverage.
metric:
  name: best_so_far
  goal: maximize
early_terminate:
  type: hyperband             # kill clearly-losing configs early
  min_iter: 40                # gens before stop-eligible (scaled to the 150-gen sweep runs)
parameters:
  # --- all PGPE hyperparameters (center_lr range refined from the popsize x center_lr pilot:
  #     0.05 too slow, 0.30 fast-but-unstable, 0.15 stable -> focus on 0.1-0.3) ---
  popsize:               {values: [128, 256]}      # 512 dropped (pilot covered it; focus 128/256)
  bound:                 {values: [0.5, 1.0, 2.0]}    # min/max of ABC + evolved-init genome (+-bound)
  sigma:                 {values: [0.15, 0.3, 0.5]}   # PGPE initial exploration std ("epsilon")
  pgpe_center_lr:        {values: [0.1, 0.2, 0.3]}    # Adam center step (refined)
  pgpe_stdev_lr:         {values: [0.05, 0.1, 0.2]}
  pgpe_stdev_max_change: {values: [0.1, 0.2, 0.4]}    # relative cap on std change/step
  pgpe_ranking_method:   {values: [centered, normalized]}
# fixed flags are appended in `command` (store_true / constants don't go under parameters)
command:
  - .venv/bin/python
  - ${program}
  - "--task=Isaac-flycrane-payload-decentralized-hovering-v0"
  - "--headless"
  - "--optimizer=pgpe"
  - "--evolve_init_weights"
  - "--weight_init_scale=0"
  - "--n_repeats=8"
  - "--history_len=1"
  - "--num_generations=150"
  - "--seed=2"
  - "--wandb"
  - "--wandb_project=hebbian-flycrane"
  - ${args_no_boolean_flags}
